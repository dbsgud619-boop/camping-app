<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f0f9ff">
<title>윤송부부일지 · 여행일지</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="여행일지">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <a class="hub-back" href="index.html" aria-label="처음으로">←</a>
  <div>
    <p class="field-label" style="margin:0 0 2px;letter-spacing:.14em;">TRAVEL LOG</p>
    <h1 style="margin:0;">🗺️ 여행일지</h1>
  </div>
</header>

<div id="syncBar" class="sync-bar hidden"></div>

<nav id="tripTabs" class="trip-tabs"></nav>

<main id="tripPanel"></main>

<div id="emptyState" class="empty-state">
  <div class="empty-icon">🧳</div>
  <p class="empty-title">아직 등록된 여행이 없어요</p>
  <p class="empty-text">위쪽의 <b>+ 새 여행</b> 버튼으로<br>첫 여행을 추가해보세요.</p>
</div>

<div id="lightbox" class="lightbox hidden">
  <img id="lightboxImg" alt="">
</div>

<div id="toast" class="toast hidden"></div>

<script src="supabase-config.js"></script>
<script src="maps-config.js"></script>
<script src="sync.js"></script>
<script src="sync-ui.js"></script>
<script src="travel-seed.js"></script>
<script src="app-travel.js"></script>
</body>
</html>
